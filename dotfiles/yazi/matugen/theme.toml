# Rendered by matugen (repo: ~/.config/quickshell/rd-shell, entry
# SCRATCH/entries/yazi.toml) from the wallpaper's Material palette every time
# scripts/wallpaper-apply.sh runs `matugen image ... --mode <dark|light>`.
#
# Read by: yazi >= 26.x as ~/.config/yazi/theme.toml. Yazi 26.9.1 ships two
# built-in presets, theme-dark.toml and theme-light.toml (schema uses [mgr],
# not the old [manager]); a user theme.toml is a PARTIAL override merged onto
# whichever preset matches the terminal's reported colour mode, and -- unless
# you additionally use [flavor] -- the SAME override is applied to both. Since
# matugen already re-renders this file per --mode on every wallpaper switch,
# that is fine: whichever mode matugen was run with is the one whose Material
# tones land here, and Material's on_X/X pairing keeps contrast correct in
# either mode. Pull in only the sections that need the wallpaper's colour --
# everything else (backgrounds, glyphs, layout) is left to the yazi preset /
# terminal, per the harmonized-hue convention in ~/.config/matugen/config.toml:
#   accent  -> primary / on_primary / primary_container / on_primary_container
#   folders -> primary (kept distinct from the fixed hues below)
#   image   -> yellow    media/av -> magenta   archive -> red   docs -> cyan
#   exec    -> green     muted/border -> outline / outline_variant
#
# Picked up on: yazi does NOT hot-reload theme.toml -- restart yazi (or open a
# new instance) to see a freshly rendered theme; there's no `ya emit`/`ya pub`
# for a theme refresh (checked: `ya emit` publishes app-side messages the
# plugin layer would have to redraw with, and no such plugin is installed).

#:schema https://yazi-rs.github.io/schemas/theme.json

# --- Manager ---
[mgr]
cwd = { fg = "{{colors.primary.default.hex}}" }

find_keyword  = { fg = "{{colors.yellow.default.hex}}", bold = true, italic = true, underline = true }
find_position = { fg = "{{colors.magenta.default.hex}}", bg = "reset", bold = true, italic = true }

marker_copied   = { fg = "{{colors.green.default.hex}}",   bg = "{{colors.green.default.hex}}" }
marker_cut      = { fg = "{{colors.red.default.hex}}",     bg = "{{colors.red.default.hex}}" }
marker_marked   = { fg = "{{colors.cyan.default.hex}}",    bg = "{{colors.cyan.default.hex}}" }
marker_selected = { fg = "{{colors.yellow.default.hex}}",  bg = "{{colors.yellow.default.hex}}" }

count_copied   = { fg = "{{colors.on_green.default.hex}}",  bg = "{{colors.green.default.hex}}" }
count_cut      = { fg = "{{colors.on_red.default.hex}}",    bg = "{{colors.red.default.hex}}" }
count_selected = { fg = "{{colors.on_yellow.default.hex}}", bg = "{{colors.yellow.default.hex}}" }

border_style = { fg = "{{colors.outline.default.hex}}" }
# --- end ---

# --- Tabs ---
[tabs]
active   = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
inactive = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
# --- end ---

# --- Mode ---
[mode]
normal_main = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
normal_alt  = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }

select_main = { fg = "{{colors.on_red.default.hex}}", bg = "{{colors.red.default.hex}}", bold = true }
select_alt  = { fg = "{{colors.red.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }

unset_main = { fg = "{{colors.on_red.default.hex}}", bg = "{{colors.red.default.hex}}", bold = true }
unset_alt  = { fg = "{{colors.red.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
# --- end ---

# --- Status bar ---
[status]
perm_sep   = { fg = "{{colors.outline_variant.default.hex}}" }
perm_type  = { fg = "{{colors.green.default.hex}}" }
perm_read  = { fg = "{{colors.yellow.default.hex}}" }
perm_write = { fg = "{{colors.red.default.hex}}" }
perm_exec  = { fg = "{{colors.cyan.default.hex}}" }

progress_normal = { fg = "{{colors.green.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
progress_error  = { fg = "{{colors.yellow.default.hex}}", bg = "{{colors.red.default.hex}}" }
# --- end ---

# --- Which-key ---
[which]
border          = { fg = "{{colors.outline.default.hex}}" }
cand            = { fg = "{{colors.primary.default.hex}}" }
rest            = { fg = "{{colors.on_surface_variant.default.hex}}" }
desc            = { fg = "{{colors.magenta.default.hex}}" }
separator_style = { fg = "{{colors.outline_variant.default.hex}}" }
# --- end ---

# --- Confirmation ---
[confirm]
border  = { fg = "{{colors.outline.default.hex}}" }
title   = { fg = "{{colors.primary.default.hex}}" }
btn_yes = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
btn_no  = { fg = "{{colors.on_surface_variant.default.hex}}" }
# --- end ---

# --- Spotter ---
[spot]
border   = { fg = "{{colors.outline.default.hex}}" }
title    = { fg = "{{colors.primary.default.hex}}" }
tbl_col  = { fg = "{{colors.primary.default.hex}}" }
tbl_cell = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}" }
# --- end ---

# --- Notification ---
[notify]
title_info  = { fg = "{{colors.green.default.hex}}" }
title_warn  = { fg = "{{colors.yellow.default.hex}}" }
title_error = { fg = "{{colors.red.default.hex}}" }
# --- end ---

# --- Picker ---
[pick]
border   = { fg = "{{colors.outline.default.hex}}" }
active   = { fg = "{{colors.primary.default.hex}}", bold = true }
inactive = { fg = "{{colors.on_surface_variant.default.hex}}" }
# --- end ---

# --- Input ---
[input]
border   = { fg = "{{colors.outline.default.hex}}" }
title    = { fg = "{{colors.on_surface.default.hex}}" }
value    = { fg = "{{colors.on_surface.default.hex}}" }
selected = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}" }
# --- end ---

# --- Completion ---
[cmp]
border   = { fg = "{{colors.outline.default.hex}}" }
active   = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}" }
inactive = { fg = "{{colors.on_surface_variant.default.hex}}" }
# --- end ---

# --- Task manager ---
[tasks]
border  = { fg = "{{colors.outline.default.hex}}" }
title   = { fg = "{{colors.on_surface.default.hex}}" }
hovered = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}", bold = true }
# --- end ---

# --- Help menu ---
[help]
border  = { fg = "{{colors.outline.default.hex}}" }
chord   = { fg = "{{colors.primary.default.hex}}" }
action  = { fg = "{{colors.on_surface.default.hex}}" }
hovered = { fg = "{{colors.on_primary_container.default.hex}}", bg = "{{colors.primary_container.default.hex}}", bold = true }
# --- end ---

# --- File-type colours ---
# Harmonized fixed hues instead of material roles alone, so image/media/
# archive/doc/exec/folder stay visually distinct (a tonal-spot scheme's
# Material roles are all one hue, per ~/.config/matugen/config.toml).
[filetype]
rules = [
	{ mime = "**/image/*", fg = "{{colors.yellow.default.hex}}" },
	{ mime = "**/{audio,video}/*", fg = "{{colors.magenta.default.hex}}" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "{{colors.red.default.hex}}" },
	{ mime = "**/application/{pdf,doc,rtf}", fg = "{{colors.cyan.default.hex}}" },
	{ mime = "vfs/{absent,stale}", fg = "{{colors.outline.default.hex}}" },
	{ url = "*", is = "orphan", bg = "{{colors.red.default.hex}}" },
	{ url = "*", is = "exec"  , fg = "{{colors.green.default.hex}}" },
	{ url = "*", is = "dummy", bg = "{{colors.red.default.hex}}" },
	{ url = "*/", is = "dummy", bg = "{{colors.red.default.hex}}" },
	{ url = "*/", fg = "{{colors.primary.default.hex}}" },
]
# --- end ---
