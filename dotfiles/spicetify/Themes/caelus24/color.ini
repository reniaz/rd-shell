; caelus24 — spotify as a terminal
;
; The palette is dacctal's "caelus", taken from refact0r's system24 theme at
; ~/.config/vesktop/themes/system24-caelus.theme.css. Each line below names the
; system24 variable it mirrors, so the two stay checkable against each other:
; edit the theme file first, then mirror the value here.
;
; user.css never reads these names directly — spicetify exposes them as
; --spice-<key>, and user.css aliases those into its own token set in :root
; (--panel, --line, --fg, --accent, ...). A key removed here becomes an empty
; string there, not a fallback, so keep every key even if a value repeats.
;
; No divergence from system24: every value below is the system24-caelus
; variable named beside it. The accent ladder is system24's own
; --accent-3 / --accent-4 / --accent-5 (EF934D / E87D2C / D76E1D).

[caelus]
; --- core surfaces -------------------------------------------------
; the gutter is system24's --bg-3: it is LIGHTER than the panels, so a panel
; reads as a recessed well rather than a card floating on black
base                = 222623 ; system24 --bg-3, the app-frame background
main                = 1B1D1C ; system24 --bg-4, the main background colour
main-elevated       = 222623 ; system24 --bg-3, secondary surfaces (menus, modals)
highlight           = 222623 ; system24 --bg-3
highlight-elevated  = 38423B ; system24 --bg-1, dark buttons when clicked
sidebar             = 1B1D1C ; same panel ground as main — every panel is one surface
player              = 1B1D1C ; the player is a panel like any other
card                = 222623 ; system24 --bg-3
shadow              = 000000 ; unused — this theme has no shadows anywhere

; --- text ----------------------------------------------------------
text                = F8F5F2 ; system24 --text-1, near-white warm cream
subtext             = CFBEB4 ; system24 --text-3, normal text
selected-row        = EF934D ; system24 --accent-2 (caelus orange)

; --- accents -------------------------------------------------------
; system24's own ladder, unmodified: --accent-3 rest, --accent-4 hover,
; --accent-5 pressed. At runtime theme.js lays the wallpaper colour over every
; accent key here (see matugen/caelus-accent.css); these values are what shows
; while that file is absent.
button              = EF934D ; system24 --accent-3, accent buttons
button-hover        = E87D2C ; system24 --accent-4, accent buttons when hovered
button-active       = D76E1D ; system24 --accent-5, accent buttons when clicked
button-disabled     = 38423B ; system24 --bg-1
tab-active          = 222623 ; system24 --bg-3
notification        = 7EC97E ; system24 --green-2
notification-error  = F16E65 ; system24 --red-2
misc                = 746863 ; system24 --text-5, muted text and timestamps

; --- extras used by user.css ---------------------------------------
; `border` is not a border colour on its own: it is system24's neutral wash
; hsl(138 8% 40%), which the theme mixes down to 10% for hover, 20% for
; borders/selection and 30% for a press. user.css does the mixing — an ini
; value cannot carry alpha.
border              = 5E6E63 ; system24 hsl(138deg 8% 40%), base of --hover/--active
border-hover        = EF934D ; system24 --border-hover (= --accent-2)
accent              = EF934D ; system24 --accent-2, small accent elements
accent-text         = F8CCAB ; system24 --accent-1, links and accent text
icon                = 988881 ; system24 --text-4, icon buttons and nav entries
green               = 7EC97E ; system24 --green-2
red                 = F16E65 ; system24 --red-2
teal                = 6C756F ; system24 --blue-2 (caelus has no blue; a muted grey-teal)
warm                = C4A898 ; system24 --purple-2 (caelus's warm foreground)

[caelus-dim]
; the same tokens with the ground pulled down and the accents pulled back one
; step. Must stay a coherent sibling of [caelus] — same relationships, less light.
base                = 1B1F1C
main                = 141615
main-elevated       = 1B1F1C
highlight           = 1B1F1C
highlight-elevated  = 2C332E
sidebar             = 141615
player              = 141615
card                = 1B1F1C
shadow              = 000000
text                = E9DFD8
subtext             = 988881
selected-row        = B86E38
button              = B86E38
button-hover        = A85F22
button-active       = 8A5228
button-disabled     = 2C332E
tab-active          = 1B1F1C
notification        = 6FB56F
notification-error  = D9615A
misc                = 5C534F
border              = 4A554E
border-hover        = B86E38
