# Themes for the apps around the rd-shell bar, re-rendered on every wallpaper
# switch by the bar's scripts/wallpaper-apply.sh. The bar's own template is not
# in here: it lives in the repo as matugen/bar.toml and is rendered in a run of
# its own first, so that no template in this file can ever stop the bar from
# following the wallpaper -- see the header of that file for why.
#
# Every template except nvim's and bat's own syntax highlighting, which moved
# to the sibling matugen/hue.toml next to matugen/bar.toml: those are the two
# the user asked to keep a real, hued scheme even on an achromatic wallpaper
# with the "Wallpaper colours" toggle on. Everything still in this file --
# including ghostty's ANSI palette and btop's meters, which read from the
# same six custom hues below -- follows the resolved scheme exactly like the
# bar does, monochrome included, on the theory that the terminal and system
# monitor going grey together with everything else is a smaller loss than a
# scheme picker would be. Rendered second, after the bar, and before
# matugen/hue.toml's own run -- see scripts/wallpaper-apply.sh and
# docs/theming/matugen-pipeline.md.

# Required by matugen even when empty: it fails the whole run with
# "missing field `config`" rather than defaulting.
[config]

# The terminal's ANSI hues. A tonal-spot scheme is one hue in five tones, so an
# ANSI palette taken from its roles alone would make red, green and blue the
# same colour -- fetchit's labels, btop's meters and every `ls` would go
# monochrome. These keep six fixed hues instead and `blend` pulls each one at
# most 15 degrees toward the wallpaper's source colour, so they read as the
# same theme without ever converging. Each renders the usual role ladder
# (`red`, `on_red`, `red_container`, `on_red_container`) at the tones of the
# current --mode, which is what keeps them legible on `surface` in light mode
# too. nvim and bat (matugen/hue.toml) read the very same six roles for their
# own syntax highlighting -- duplicated there rather than shared, since
# matugen has no config-include mechanism. Keep both tables byte-identical:
# a `red` that means one colour in the terminal and a different one in nvim
# would be a worse inconsistency than either going grey together.
[config.custom_colors]
red = { color = "#e5534b", blend = true }
green = { color = "#57ab5a", blend = true }
yellow = { color = "#c69026", blend = true }
blue = { color = "#539bf5", blend = true }
magenta = { color = "#b083f0", blend = true }
cyan = { color = "#39c5cf", blend = true }

# Vesktop accent. The template lives next to the theme that reads it, for the
# same reason the rd-shell one lives in its repo. Output is a Vencord theme of
# its own (enabled beside system24-caelus) rather than an @import from it:
# Vencord cache-busts only the themes it loads itself, so a nested import would
# keep the previous wallpaper's colour until a restart. Vencord watches the
# themes folder, so a render here recolours the running client.
[templates.vesktop]
input_path = '~/.config/vesktop/themes/matugen/caelus-accent.css'
output_path = '~/.config/vesktop/themes/caelus-accent.theme.css'

# Spotify (spicetify caelus24) accent. The caelus24 theme.js fetches it from
# xpui and swaps it in live; xpui is where it has to end up because the flatpak
# sandbox cannot see ~/.config. It is rendered to ~/.cache and copied, not
# rendered into xpui: after a spotify update xpui is root-owned or missing until
# `spicetify apply`, and a template whose output cannot be written stops
# matugen before it renders the others. The copy fails
# quietly instead; the next wallpaper switch, or the --restore at login, puts
# the file back, and until then the theme shows color.ini's orange.
[templates.spotify]
input_path = '~/.config/spicetify/Themes/caelus24/matugen/caelus-accent.css'
output_path = '~/.cache/caelus24/caelus-accent.css'
post_hook = 'cp -f ~/.cache/caelus24/caelus-accent.css /var/lib/flatpak/app/com.spotify.Client/x86_64/stable/active/files/extra/share/spotify/Apps/xpui/ 2>/dev/null || true'

# Ghostty (the only terminal) follows the wallpaper palette. Ghostty has no
# file-watch for theme files and documents that reload needs a keybind/menu
# action or a restart -- but the running GTK app also exposes that same
# `reload-config` action over D-Bus (org.gtk.Actions on the well-known name
# com.mitchellh.ghostty), which is what the in-app "Reload Config" keybind
# and command-palette entry call. Activating it from the post_hook reloads
# every open window/tab immediately, with no window creation or signals.
# Verified live: reloaded a running window from the old caelus palette to a
# freshly matugen-rendered one and watched Ghostty's own "Reloaded the
# config" toast fire and the cursor colour flip from caelus's red-brown to
# matugen's palette colour.
# busctl rather than gdbus, for --auto-start=no: ghostty ships a D-Bus
# service file, so a plain call with no ghostty running would activate a
# fresh background instance on every wallpaper switch instead of doing
# nothing. The call only reaches ghostty's own bus name, --timeout keeps a
# hung instance from stalling the switch, and `|| true` keeps a missing one
# from aborting the matugen run.
[templates.ghostty]
input_path = '~/.config/ghostty/matugen/theme'
output_path = '~/.config/ghostty/themes/matugen'
post_hook = 'busctl --user --auto-start=no --timeout=2 call com.mitchellh.ghostty /com/mitchellh/ghostty org.gtk.Actions Activate "sava{sv}" reload-config 0 0 >/dev/null 2>&1 || true'

# btop theme. btop.conf has color_theme = "matugen", which btop resolves
# against ~/.config/btop/themes/matugen.theme (name only, no path/extension).
# A running btop reloads both its config and the active .theme file on
# SIGUSR2 without a restart (verified 2026-09-25: edited a theme file in
# place and signaled a throwaway btop instance in tmux, colors updated live).
# pkill -x matches only a process literally named "btop", so this can't hit
# anything else; it no-ops (exit 1, swallowed by || true) when btop isn't running.
[templates.btop]
input_path = '~/.config/btop/matugen/matugen.theme'
output_path = '~/.config/btop/themes/matugen.theme'
post_hook = 'pkill -USR2 -x btop || true'

# Terminal cava (0.10.2, run by hand as plain `cava` in ghostty for
# screenshots). It reads ~/.config/cava/config by default with no -p flag.
# The bar's own cava (Services/Cava.qml) always launches as
# `cava -p ~/.cache/rd-shell/cava.conf`, an explicit -p that makes it never
# look at this file, so this template cannot affect the bar.
#
# cava 0.10.2 has no `theme=`/include directive (checked against
# /usr/share/doc/cava/README.md and its shipped example config on this
# machine) -- unlike ghostty, there is no way to keep a hand-owned
# ~/.config/cava/config next to a separate generated colour file, so the
# whole config is matugen-owned. Every section but [color] is left out of
# the template so cava falls back to its own built-in defaults.
[templates.cava]
input_path = '~/.config/cava/matugen/config'
output_path = '~/.config/cava/config'
# SIGUSR2 = "reload colors only" (cava README, confirmed against 0.10.2's
# actual behaviour: a throwaway `cava -p <scratch config>` instance under a
# pty emitted the OLD gradient colour in its ANSI SGR codes before the
# signal and the NEW one immediately after, with no restart). Only a bare
# `cava` (no `-p`) is signalled -- matched by checking each `cava`-comm
# process's /proc/<pid>/cmdline for a `-p` flag -- so the bar's own
# `cava -p ~/.cache/rd-shell/cava.conf` is always skipped. Verified live:
# the bar's cava PID was unchanged and it kept running throughout.
post_hook = 'for p in $(pgrep -x cava); do c=$(tr "\0" " " < /proc/$p/cmdline 2>/dev/null); case "$c" in *-p*) ;; *) kill -USR2 "$p" 2>/dev/null ;; esac; done || true'

# yazi >= 26.x (schema uses [mgr], not the old [manager]; theme-dark.toml /
# theme-light.toml are the built-in presets this partially overrides). See
# ~/.config/yazi/matugen/theme.toml's header for the merge semantics and for
# why live reload is not wired up here (ya emit/ya pub need $YAZI_ID, which is
# only set inside a shell yazi itself spawned -- unreachable from this hook).
[templates.yazi]
input_path = '~/.config/yazi/matugen/theme.toml'
output_path = '~/.config/yazi/theme.toml'

# Neovim's colorscheme moved to matugen/hue.toml -- syntax highlighting needs
# several hues to tell things apart, so it must not always follow chrome
# into scheme-monochrome. See that file's own header.

# Firefox chrome/content colours. Firefox only re-reads chrome/userChrome.css
# and userContent.css at startup, so a running Firefox picks this up on its
# next launch -- there is no live-reload path for chrome CSS the way ghostty
# or btop get one, and no post_hook can change that (a browser restart is a
# user decision, not something a matugen run should trigger). The profile's
# chrome/matugen.css is a symlink straight to this output_path.
[templates.firefox]
input_path = '~/.config/matugen/templates/firefox-colors.css'
output_path = '~/.cache/rd-shell/firefox-colors.css'

# bat's own theme moved to matugen/hue.toml, same reasoning as nvim above.

# Starship prompt. No post_hook, unlike bat/btop/ghostty above -- starship
# has no cache or running instance to signal, it just re-reads
# ~/.config/starship.toml from disk on every prompt it draws, so this file
# lands fresh in time for the very next prompt with nothing else to do.
[templates.starship]
input_path = '~/.config/matugen/templates/starship.toml'
output_path = '~/.config/starship.toml'

# Qt/KDE apps (Dolphin, Ark, kdialog, any file-open dialog in an app run
# with QT_QPA_PLATFORMTHEME=kde) read colours from the *active* KDE colour
# scheme in kdeglobals, not from a file matugen can just overwrite in place --
# a plain file write leaves every already-running KDE app showing stale
# colours. plasma-apply-colorscheme is the only thing that both rewrites
# kdeglobals AND notifies running apps over D-Bus, but it refuses to
# "apply" a scheme name that is already the active one (verified: re-running
# `plasma-apply-colorscheme Matugen` twice in a row prints "is already set
# as the theme" and changes nothing the second time). So this entry renders
# to a fixed file (Matugen.colors), and the post_hook copies that fresh
# render to a second file (Matugen2.colors) and applies whichever of the two
# NAMES is not currently active -- content is always fresh either way, only
# the name alternates, which is what makes plasma-apply-colorscheme treat
# every wallpaper switch as a real change. Verified live 2026-09-25: applied
# Matugen -> refused re-apply of Matugen -> applied Matugen2 -> flipped back
# to Matugen, kdeglobals' [General] ColorScheme following each apply, and a
# freshly launched kdialog window picked up the new dark palette immediately
# with no restart.
[templates.kde]
input_path = '~/.config/matugen/templates/kde-colors.colors'
output_path = '~/.local/share/color-schemes/Matugen.colors'
post_hook = 'cp -f ~/.local/share/color-schemes/Matugen.colors ~/.local/share/color-schemes/Matugen2.colors 2>/dev/null || true; c=$(kreadconfig6 --file kdeglobals --group General --key ColorScheme 2>/dev/null); if [ "$c" = "Matugen" ]; then plasma-apply-colorscheme Matugen2 >/dev/null 2>&1 || true; else plasma-apply-colorscheme Matugen >/dev/null 2>&1 || true; fi'

# Papirus-Dark folder colour, tracking the wallpaper accent. Nothing reads
# the rendered file itself (see the template's own header) -- its only job
# is to give matugen something to render so the post_hook fires.
#
# The post_hook re-derives the primary hex from $CACHE/matugen.json itself
# (same file wallpaper-apply.sh's apply_border/apply_lock already read)
# rather than parse this output back out, maps it to the nearest
# papirus-folders colour by hue+saturation, and no-ops when that colour
# hasn't changed since the last run (state kept in
# ~/.cache/rd-shell/papirus-accent-color). When it does change, the actual
# `papirus-folders -C` call -- and the gtk-update-icon-cache rebuild that
# comes with it, measured at several seconds -- is fired with `setsid -f`,
# detached, so this post_hook itself returns in ~15ms and never delays the
# $STATE write later in wallpaper-apply.sh that triggers the wallpaper swap
# animation.
#
# Verified 2026-09-25: ran scripts/papirus-accent.sh directly against the
# live ~/.cache/rd-shell/matugen.json (primary #c2c1ff) -- Papirus-Dark's
# resolved places/folder.svg symlink target moved from folder-blue.svg to
# folder-indigo.svg, and a second run was a no-op (same target, ~15ms,
# nothing invoked). Also rendered the template through a scratch matugen
# config (never the real one) and confirmed the emitted hex matches
# matugen.json's `primary` field exactly for the current wallpaper.
[templates.papirus-accent]
input_path = '~/.config/matugen/templates/papirus-accent.txt'
output_path = '~/.cache/rd-shell/papirus-accent.txt'
post_hook = '~/.config/quickshell/rd-shell/scripts/papirus-accent.sh >/dev/null 2>&1 || true'

# GTK3/GTK4/libadwaita colours (xdg-desktop-portal-gtk's file picker,
# pavucontrol, any other non-Qt app). ~/.config/gtk-3.0/gtk.css and
# ~/.config/gtk-4.0/gtk.css each carry a permanent
# `@import url("file://$HOME/.cache/rd-shell/gtk-colors.css");` after their
# existing `@import 'colors.css';` (KDE's Breeze defines, left alone -- adw-gtk3
# doesn't use them, and gtk-theme-name is now adw-gtk3-dark, not Breeze), so
# nothing needs re-linking here -- only the cache file needs re-rendering.
# Neither GTK3 nor GTK4 watches gtk.css for changes: a running app only picks
# up a new render on its next launch, not live. No post_hook -- there is
# nothing safe to signal (unlike btop's SIGUSR2 or ghostty's D-Bus action,
# GTK apps have no reload-css call, and blindly killing/restarting every GTK
# app on a wallpaper switch is exactly the "never restart apps the user is
# using" rule this file must not violate).
#
# Verified live (2026-09-25): rendered this template as
# ~/.cache/rd-shell/gtk-colors.css, launched a plain GTK3 window
# (adw-gtk3-dark) and an Adw.ApplicationWindow (GTK4/libadwaita) -- both
# picked up window_bg_color, view_bg_color etc. from this file. libadwaita
# >= 1.6 (1.9.3 here) takes its accent from the gsettings accent-color
# preset, not from @accent_bg_color -- but it also reads CSS variables, and
# the template's :root block (--accent-bg-color and friends) sits in the
# user stylesheet, above that preset. Verified: a forced accent there turned
# a libadwaita suggested-action button with accent-color still 'blue'.
[templates.gtk]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.cache/rd-shell/gtk-colors.css'
