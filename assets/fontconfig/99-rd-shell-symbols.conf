<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    The bar draws its icons as ligatures: "volume_down" in Material Symbols
    Rounded is one glyph. A font that answers to that family name without
    carrying the glyph therefore does not fall back to a box. Qt falls back to
    a text font instead, and the label reads "volume_down" in words.

    Applications that use a handful of these icons ship their own cut of the
    font, under the same family name, into the same user font directory. Once
    one of those has been scanned, fontconfig can answer "Material Symbols
    Rounded" with a file holding thirty glyphs rather than the three thousand
    Google publishes, and every icon on the bar turns into its own name.

    Subsets are dropped here, so the full variable font is the only file left
    claiming the family. Nothing else loses an icon by it: an application that
    shipped a subset and asks for the family by name now gets a superset of
    whatever it cut.
  -->
  <selectfont>
    <rejectfont>
      <glob>*MaterialSymbols*subset*</glob>
      <glob>*MaterialSymbols*Subset*</glob>
      <glob>*material-symbols*subset*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
