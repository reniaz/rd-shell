# Optional include for the cursor-trail shader (idea 14, sahaj-b/ghostty-
# cursor-shaders, MIT). Included from config.ghostty via
#   config-file = ?shaders/cursor-trail.conf
# -- the leading `?` makes a missing/renamed file harmless, so this is the
# one-line toggle: delete or rename this file to turn the trail off, put it
# back (or `git checkout` it) to turn it on. Nothing in config.ghostty itself
# needs touching either way.
#
# custom-shader-animation defaults to `true` in Ghostty 1.3.1 (focused
# surfaces only, "generally less than 10%" extra CPU per its own docs), which
# is enough for this trail to animate -- no explicit override needed here.
# Independent of any screen-wide CRT/bloom shader: neither idea exists in the
# live config today (checked config.ghostty, Repo/shaders/, the whole
# filesystem outside Local/), so there is nothing to conflict with.
custom-shader = ghostty-cursor-trail.glsl
