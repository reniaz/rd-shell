# Themed to match the quickshell bar — palette mirrors Config/Colors.qml
# (system24 "caelus"), fonts and pill shapes mirror Pill.qml.

$font   = caelusevka
$icons  = Material Symbols Rounded

# The palette is generated on every wallpaper switch by
# scripts/wallpaper-apply.sh, so the lock screen follows the theme the way the
# bar and the window borders do. Only the seven colour variables are machine
# written; everything below -- layout, fonts, pill shapes -- stays hand kept.
# Regenerate without switching wallpaper: wallpaper-apply.sh --lock
source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
}

animations {
    enabled = true
    # same feel as the bar's 150ms Easing.OutCubic transitions
    bezier = outCubic, 0.33, 1, 0.68, 1
    animation = fadeIn, 1, 3, outCubic
    animation = fadeOut, 1, 3, outCubic
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    # The wallpaper the switcher last applied, exported as a fixed-name PNG by
    # scripts/wallpaper-apply.sh. Not the live file: the collection holds jpg,
    # jpeg, gif and png, and this path has to have one stable extension.
    path = ~/.cache/rd-shell/lock.png
    blur_passes = 2
    blur_size = 8
    brightness = 0.4
    vibrancy = 0.1
}

# lock glyph
label {
    monitor =
    text = lock
    font_family = $icons
    font_size = 44
    color = $accent

    position = 0, 250
    halign = center
    valign = center
}

# TIME — matches the bar's HH:mm
label {
    monitor =
    text = $TIME
    font_family = $font
    font_size = 96
    color = $fg

    position = 0, 140
    halign = center
    valign = center
}

# DATE — matches the bar's "ddd d MMM"
label {
    monitor =
    text = cmd[update:60000] date +"%a %-d %b"
    font_family = $font
    font_size = 20
    color = $muted

    position = 0, 55
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 48
    rounding = -1            # fully rounded, like the bar's pills
    outline_thickness = 4

    inner_color = $bg
    outer_color = $accent
    # Red while PAM checks. A correct password unlocks instantly, so this ring is
    # in practice only ever seen during PAM's delay after a WRONG one -- which is
    # why it must read as failure, not as progress.
    check_color = $fail
    fail_color = $fail
    capslock_color = $error
    font_color = $fg
    font_family = $font

    placeholder_text = Password
    fail_text = $PAMFAIL ($ATTEMPTS)
    dots_spacing = 0.3
    fade_on_empty = false

    position = 0, -40
    halign = center
    valign = center
}
